{% extends "base.html" %}{% block content %}<h1>Priority decisions</h1><table><tr><th>Message</th><th>Item</th><th>Priority</th><th>Reason</th><th>Signals</th><th>Confidence</th></tr>{% for x in items %}<tr><td>{{x.message_id}}</td><td>{{x.item_id or "-"}}</td><td><span class="pill {{x.priority}}">{{x.priority}}</span></td><td>{{x.reason}}</td><td>{{x.signals|join(", ")}}</td><td>{{x.confidence}}</td></tr>{% endfor %}</table>{% endblock %}
