<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L2 Message Intelligence</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#e8eaf0;margin:0}nav{padding:16px 28px;background:#171a21;display:flex;gap:20px}nav a{color:#d7dbea;text-decoration:none}
main{max-width:1200px;margin:28px auto;padding:0 20px}.card{background:#181c24;border:1px solid #292e3a;border-radius:12px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.num{font-size:28px;font-weight:700}.muted{color:#9ba3b5}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #292e3a;text-align:left;vertical-align:top}.pill{padding:4px 8px;border-radius:8px;background:#292e3a}.critical{background:#5b2020}.high{background:#563d18}.medium{background:#3b3d1d}.low{background:#253b2c}
input{width:75%;padding:12px;border-radius:8px;border:1px solid #444;background:#101319;color:#fff}button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word}
</style></head><body>
<nav><a href="/">Dashboard</a><a href="/priorities">Priorities</a><a href="/groups">Related Groups</a><a href="/messages">L2 Messages</a><a href="/privacy">Privacy</a><a href="/assistant">Assistant</a><a href="/demo">Mandatory Demo</a></nav>
<main>{% block content %}{% endblock %}</main></body></html>
